name: Deploy to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1 

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site (inline resume components into dist/)
        run: node build.js

      - name: Verify resume content is in the built HTML
        run: node scripts/check-resume-html.js dist/index.html

      # dist/ is the deploy artifact. Other apps live in the same bucket under
      # their own prefixes and are NOT in dist/, so they must stay excluded or
      # --delete removes them.
      - name: Sync files to S3
        run: aws s3 sync dist/ s3://www.georgewallden.com --delete --exclude "llm-detector/*" --exclude "BudgetApp/*" --exclude "BudgetApp-dev/*"

      - name: Deploy visitor notifier
        run: |
          cd utils/resume-notifier
          zip function.zip lambda_function.py
          aws lambda update-function-code \
            --function-name ResumeVisitorNotifier \
            --zip-file fileb://function.zip \
            --region us-east-1
          aws lambda wait function-updated \
            --function-name ResumeVisitorNotifier \
            --region us-east-1
          aws lambda publish-version \
            --function-name ResumeVisitorNotifier \
            --region us-east-1 \
            --query "FunctionArn" --output text

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation --distribution-id E2ZL7HX4ZYZ96R --paths "/*"